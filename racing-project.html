<p class="m-plead" style="margin: 0; max-width: 720px; font-size: 21px; line-height: 1.5; color: #5A3A40">An arcade racer reimagined as free-to-play, built from scratch with the game director. I led UX and wrote most of the design documentation, from the first wireframes to the spec the playable prototype was built from.</p>

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5A3A40">I benchmarked classic arcade racers and current free-to-play games with a template I designed: key data, annotated references and one concrete opportunity per game. A second round focused only on leaderboards and competition.</p>

</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #6B5357">HOW I SPECIFIED EACH MECHANIC</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">

<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 700; font-size: 16px">Tune</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">Adjusted in playtests, no code changes.</div></div>

</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #6B5357">SAMPLE · ONE MECHANIC, AS THE DEVELOPER RECEIVED IT</div>
<div style="border: 2px solid #D3C9B6; border-radius: 16px; overflow: hidden">
<div style="display: grid; grid-template-columns: 1.1fr 0.8fr 1.6fr 1.6fr 0.6fr 1.6fr; background: #FFFFFF; color: #4B1D26; font-weight: 800; font-size: 12px; letter-spacing: 0.5px"><div style="padding: 12px 12px">Variable</div><div style="padding: 12px 12px">Type</div><div style="padding: 12px 12px">Low ↓</div><div style="padding: 12px 12px">High ↑</div><div style="padding: 12px 12px">Default</div><div style="padding: 12px 12px">Design intent</div></div>
<div style="display: grid; grid-template-columns: 1.1fr 0.8fr 1.6fr 1.6fr 0.6fr 1.6fr; border-top: 1px solid #D3C9B6; font-size: 13px; line-height: 1.45"><div style="padding: 12px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: #4B1D26">cam_height</div><div style="padding: 12px; color: #5A3A40">float (m)</div><div style="padding: 12px; color: #5A3A40">1.0 – Near car level. Immersive, poor forward visibility.</div><div style="padding: 12px; color: #5A3A40">20.0 – Very elevated. Great readability, loses tension.</div><div style="padding: 12px; font-weight: 800; color: {{tone}}">4.0</div><div style="padding: 12px; color: #5A3A40">Raise if the player cannot read upcoming events.</div></div>
<div style="display: grid; grid-template-columns: 1.1fr 0.8fr 1.6fr 1.6fr 0.6fr 1.6fr; border-top: 1px solid #D3C9B6; font-size: 13px; line-height: 1.45"><div style="padding: 12px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: #4B1D26">cam_distance</div><div style="padding: 12px; color: #5A3A40">float (m)</div><div style="padding: 12px; color: #5A3A40">1.0 – Car nearly fills the frame.</div><div style="padding: 12px; color: #5A3A40">20.0 – Far back. Car looks small.</div><div style="padding: 12px; font-weight: 800; color: {{tone}}">6.0</div><div style="padding: 12px; color: #5A3A40">Balance car presence vs track visibility.</div></div>
<div style="display: grid; grid-template-columns: 1.1fr 0.8fr 1.6fr 1.6fr 0.6fr 1.6fr; border-top: 1px solid #D3C9B6; font-size: 13px; line-height: 1.45"><div style="padding: 12px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: #4B1D26">cam_fov</div><div style="padding: 12px; color: #5A3A40">float (º)</div><div style="padding: 12px; color: #5A3A40">50 – Narrow. Less perceived speed.</div><div style="padding: 12px; color: #5A3A40">100 – Wide. Strong speed sensation.</div><div style="padding: 12px; font-weight: 800; color: {{tone}}">75</div><div style="padding: 12px; color: #5A3A40">Wider FOV exaggerates speed.</div></div>
</div>

</div>

<div class="m-callout" style="padding: 24px 28px; border: 2px solid #D3C9B6; border-radius: 18px; display: flex; gap: 18px; align-items: center">

<sc-if value="{{isHud}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="font-weight: 700; font-size: 14px; letter-spacing: 2px; color: {{tone}}">UX · IN-RACE HUD</div>
<h3 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.03; letter-spacing: -1.2px">Only what a racer needs at a glance</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5A3A40">I compared the HUDs of six racing games using the same colour legend for every element, to see what is essential in any racer and what depends on the genre. Then I proposed ours, tested over screenshots of the Godot prototype.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #6B5357">WHAT I DECIDED</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 700; font-size: 16px">Compare like for like</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">One legend, six games, element by element.</div></div>
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 700; font-size: 16px">Keep the essential</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">Time first, then lap, position and map.</div></div>
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 700; font-size: 16px">Read it near the car</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">Key info where the eyes already are.</div></div>
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 700; font-size: 16px">Two clear states</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">&quot;Charging&quot; and &quot;ready&quot; told apart at a glance.</div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">

return {
...zoomHandlers,
zoomOn: !!zoomItem,
zCap: zoomItem ? zoomItem.cap : '',
zCount: zoomItem ? (g.indexOf(zoomItem.id) + 1) + ' / ' + g.length : '',
zMany: g.length > 1,
zPos: fixed ? 'fixed' : 'absolute',
zRadius: fixed ? '0' : '28px',
zAlign: fixed ? 'center' : 'flex-start',
zArrowTop: fixed ? '50%' : '340px',
zMaxH: fixed ? 'calc(100vh - 190px)' : '760px',
closeZoom: (ev) => { stop(ev); this.setState({ zoom: null }); },
prevZoom: (ev) => { stop(ev); this.step(-1); },
nextZoom: (ev) => { stop(ev); this.step(1); },
tone: selected.tone,
abilities,
isBench: picked === 'bench',
isEarly: picked === 'early',
isMech: picked === 'mech',
isHud: picked === 'hud',
isNav: picked === 'nav',
isLead: picked === 'lead',
isTrain: picked === 'train',
isSet: picked === 'set'
};
}
}
