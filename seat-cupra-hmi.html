<p class="m-plead" style="margin: 0; max-width: 720px; font-size: 21px; line-height: 1.5; color: #5A3A40">Almost seven years designing the in-car infotainment for SEAT and CUPRA, first as UI/UX Designer and then leading the UX team. Interfaces for people who can only spare a glance.</p>

<h3 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.03; letter-spacing: -1.2px">Learning from the market and from drivers</h3>
