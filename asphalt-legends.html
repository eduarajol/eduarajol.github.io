<section class="aq-hero"><div class="aq-hero-t"><div class="aq-eb">SIDE QUEST · 2026 · GAME DESIGN BOOTCAMP</div><h1>Asphalt Legends</h1><div class="aq-role">Resource flow analysis</div><p class="aq-lead">An analysis I made during the Game Design Bootcamp. I mapped how resources move through Asphalt Legends in the first sessions: the actions a player takes, what each one spends and earns, and how they chain into the game loop.</p><div class="aq-facts"><div><span>ROLE</span><b>Game Designer</b></div><div><span>CONTEXT</span><b>Bootcamp · 2026</b></div><div><span>FOCUS</span><b>Resource flow</b></div><div><span>TOOL</span><b>Figma</b></div></div><a class="aq-cta" href="https://www.figma.com/proto/A4y40PRMMIc2lROxdNqrri/BOOTCAMP?node-id=238-1179&amp;viewport=-440%2C348%2C0.26&amp;t=IlerWp08xB70Fw7i-1&amp;scaling=scale-down&amp;content-scaling=fixed&amp;page-id=238%3A1161" target="_blank" rel="noopener">See the full presentation in Figma <span aria-hidden="true">↗</span></a></div><a class="aq-hero-img" href="img/asphalt/garage.jpg" target="_blank" rel="noopener"><img src="img/asphalt/garage.jpg" alt="Asphalt Legends garage screen with the car’s stats, rank and fuel"></a></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">01</span><h2>Three actions to start</h2></div><p class="aq-sub">After a first play session, everything the player does comes down to three actions.</p><div class="aq-acts"><div><span>01</span><b>Race</b><p>Pick a race on the season map and drive it.</p></div><div><span>02</span><b>Get rewards</b><p>Finish the race and collect what it pays.</p></div><div><span>03</span><b>Upgrade vehicle</b><p>Spend resources to improve the car’s stats and rank.</p></div></div></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">02</span><h2>The resources</h2></div><p class="aq-sub">Twelve resources in three groups. Point at one, or tap it on a phone, to see where it is spent and earned on this page.</p><div class="aq-res"><div class="aq-g"><div class="aq-gl">CURRENCY</div><div class="aq-gc"><span class="rk" data-r="credits" tabindex="0">Credits <em>soft currency</em></span><span class="rk" data-r="tokens" tabindex="0">Tokens <em>hard currency</em></span><span class="rk" data-r="money" tabindex="0">Real money</span><span class="rk" data-r="ads" tabindex="0">Ads</span><span class="rk" data-r="time" tabindex="0">Time</span><a class="rk shop" href="#shop">The shop ↓</a></div></div><div class="aq-g"><div class="aq-gl">VEHICLE</div><div class="aq-gc"><span class="rk" data-r="packs" tabindex="0">Card packs</span><span class="rk" data-r="parts" tabindex="0">Part cards</span><span class="rk" data-r="blueprints" tabindex="0">Vehicle cards <em>blueprints</em></span><span class="rk" data-r="vehicles" tabindex="0">Vehicles</span></div></div><div class="aq-g"><div class="aq-gl">RACING ITEMS</div><div class="aq-gc"><span class="rk" data-r="flags" tabindex="0">Season flags</span><span class="rk" data-r="rep" tabindex="0">Reputation points</span><span class="rk" data-r="fuel" tabindex="0">Fuel</span></div></div></div></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">03</span><h2>What goes in, what comes out</h2></div><p class="aq-sub">Each basic action spends some resources and earns others.</p><div class="lg lg-io"><span><i class="k start"></i>Start of the loop</span><span><i class="k main"></i>Main action</span><span><i class="k sec"></i>Secondary action</span><span><i class="k cdk"></i>Condition</span><span><i class="k csq"></i>Consequence</span><span><span class="rc in"><b>+</b>Earned</span></span><span><span class="rc out"><b>−</b>Spent</span></span></div><div class="aq-io"><div class="io"><div class="io-n">Race</div><div class="io-r"><div class="io-l">SPENDS</div><div class="rcs"><span class="rc out" data-r="fuel"><b>−</b>Fuel</span></div></div><div class="io-r"><div class="io-l">EARNS</div><div class="rcs"><span class="none">Nothing</span></div></div></div><div class="io"><div class="io-n">Upgrade vehicle</div><div class="io-r"><div class="io-l">SPENDS</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="tokens"><b>−</b>Tokens</span><span class="rc out" data-r="money"><b>−</b>Real money</span><span class="rc out" data-r="ads"><b>−</b>Ads</span><span class="rc out" data-r="parts"><b>−</b>Part cards</span><span class="rc out" data-r="blueprints"><b>−</b>Vehicle cards</span></div></div><div class="io-r"><div class="io-l">EARNS</div><div class="rcs"><span class="rc in"><b>+</b>Rank upgrade</span><span class="rc in"><b>+</b>Stat upgrade</span></div></div></div><div class="io"><div class="io-n">Get rewards</div><div class="io-r"><div class="io-l">SPENDS</div><div class="rcs"><span class="none">Nothing</span></div></div><div class="io-r"><div class="io-l">EARNS</div><div class="rcs"><span class="rc in" data-r="credits"><b>+</b>Credits</span><span class="rc in" data-r="rep"><b>+</b>Reputation points</span><span class="rc in" data-r="flags"><b>+</b>Season flags</span><span class="rc in" data-r="packs"><b>+</b>Card packs</span><span class="rc in" data-r="parts"><b>+</b>Part cards</span><span class="rc in" data-r="blueprints"><b>+</b>Vehicle cards</span></div></div></div></div></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">04</span><h2>The core loop</h2></div><p class="aq-sub">The first steps, as a loop.</p><div class="aq-core"><div class="nd start"><div class="nd-t">Select race</div></div><span class="cl-ar" aria-hidden="true">→</span><div class="nd main"><div class="nd-t">Race</div></div><span class="cl-ar" aria-hidden="true">→</span><div class="nd main"><div class="nd-t">Get rewards</div></div><span class="cl-ar" aria-hidden="true">→</span><div class="nd main"><div class="nd-t">Upgrade vehicle</div></div></div><div class="aq-core-back">↺ And back to Select race</div></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">05</span><h2>The loop, with more gameplay</h2></div><p class="aq-sub">As play goes on, two conditions split the loop into three paths. Every step shows what it spends and earns.</p><div class="lg"><span><i class="k start"></i>Start of the loop</span><span><i class="k main"></i>Main action</span><span><i class="k sec"></i>Secondary action</span><span><i class="k cdk"></i>Condition</span><span><i class="k csq"></i>Consequence</span><span><span class="rc in"><b>+</b>Earned</span></span><span><span class="rc out"><b>−</b>Spent</span></span></div><div class="aq-lanes"><div class="ln"><div class="ln-h"><span>1</span><div><h3>Race</h3><p>Two checks stand between the player and the race.</p></div></div><div class="ln-b"><div class="nd start"><div class="nd-t">Select race</div></div><div class="dn" aria-hidden="true">↓</div><div class="cd"><div class="cd-q"><i></i>Is the car’s rank high enough?</div><div class="brs"><div class="br no"><span>NOT ENOUGH</span>Upgrade the vehicle first (path 2)</div><div class="br yes"><span>ENOUGH</span>Go on</div></div></div><div class="dn" aria-hidden="true">↓</div><div class="cd"><div class="cd-q"><i></i>Is there fuel left?</div><div class="brs"><div class="br no"><span>NO</span>Refill or wait</div><div class="br yes"><span>YES</span>Go on</div></div></div><div class="opts"><div class="nd sec"><div class="nd-t">Refill fuel</div><div class="rcs"><span class="rc out" data-r="tokens"><b>−</b>Tokens</span><span class="rc out" data-r="ads"><b>−</b>Ads</span><span class="rc in" data-r="fuel"><b>+</b>Fuel</span></div></div><div class="nd sec"><div class="nd-t">Wait</div><div class="rcs"><span class="rc out" data-r="time"><b>−</b>Time</span><span class="rc in" data-r="fuel"><b>+</b>Fuel</span></div></div></div><div class="dn" aria-hidden="true">↓</div><div class="nd main"><div class="nd-t">Race</div><div class="rcs"><span class="rc out" data-r="fuel"><b>−</b>Fuel</span></div></div><div class="dn" aria-hidden="true">↓</div><div class="nd main"><div class="nd-t">Get rewards</div><div class="rcs"><span class="rc in" data-r="credits"><b>+</b>Credits</span><span class="rc in" data-r="rep"><b>+</b>Reputation points</span><span class="rc in" data-r="flags"><b>+</b>Season flags</span><span class="rc in" data-r="packs"><b>+</b>Card packs</span><span class="rc in" data-r="parts"><b>+</b>Part cards</span><span class="rc in" data-r="blueprints"><b>+</b>Vehicle cards</span></div></div></div><div class="ln-back">↺ Back to Select race, or on to Upgrade vehicle</div></div><div class="ln"><div class="ln-h"><span>2</span><div><h3>Upgrade the vehicle</h3><p>Without enough stars, the player has to collect blueprints first.</p></div></div><div class="ln-b"><div class="nd main"><div class="nd-t">Upgrade vehicle</div></div><div class="dn" aria-hidden="true">↓</div><div class="cd"><div class="cd-q"><i></i>Does the vehicle have enough stars?</div><div class="brs"><div class="br no"><span>NOT ENOUGH ★☆☆</span>Get blueprints</div><div class="br yes"><span>ENOUGH ★★☆</span>Upgrade stats (path 3)</div></div></div><div class="dn" aria-hidden="true">↓</div><div class="opts-h">GET BLUEPRINTS</div><div class="opts"><div class="nd sec"><div class="nd-t">Buy blueprints</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="ads"><b>−</b>Ads</span><span class="rc out" data-r="money"><b>−</b>Real money</span><span class="rc in" data-r="blueprints"><b>+</b>Vehicle cards</span></div></div><div class="nd sec"><div class="nd-t">Earn them as rewards</div><div class="rcs"><span class="rc in" data-r="blueprints"><b>+</b>Vehicle cards</span></div></div><div class="nd sec"><div class="nd-t">Open card packs</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="packs"><b>−</b>Card packs</span><span class="rc out" data-r="ads"><b>−</b>Ads</span><span class="rc out" data-r="money"><b>−</b>Real money</span><span class="rc in" data-r="credits"><b>+</b>Credits</span><span class="rc in" data-r="parts"><b>+</b>Part cards</span><span class="rc in" data-r="blueprints"><b>+</b>Vehicle cards</span></div></div><div class="nd sec"><div class="nd-t">Other options</div><div class="nd-note">Shop, syndicate missions, season pass and more</div><div class="rcs"><span class="rc in" data-r="blueprints"><b>+</b>Vehicle cards</span></div></div></div><div class="dn" aria-hidden="true">↓</div><div class="nd csq"><div class="nd-t">The vehicle levels up</div><div class="rcs"><span class="rc in"><b>+</b>★ Star</span></div></div></div><div class="ln-back">↺ Back to the star check</div></div><div class="ln"><div class="ln-h"><span>3</span><div><h3>Upgrade stats</h3><p>Every stat upgrade costs the same two resources and raises the car’s rank.</p></div></div><div class="ln-b"><div class="opts-h">PICK A STAT</div><div class="opts"><div class="nd sec"><div class="nd-t">Top speed</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="parts"><b>−</b>Part cards</span><span class="rc in"><b>+</b>Top speed</span></div></div><div class="nd sec"><div class="nd-t">Acceleration</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="parts"><b>−</b>Part cards</span><span class="rc in"><b>+</b>Acceleration</span></div></div><div class="nd sec"><div class="nd-t">Handling</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="parts"><b>−</b>Part cards</span><span class="rc in"><b>+</b>Handling</span></div></div><div class="nd sec"><div class="nd-t">Nitro</div><div class="rcs"><span class="rc out" data-r="credits"><b>−</b>Credits</span><span class="rc out" data-r="parts"><b>−</b>Part cards</span><span class="rc in"><b>+</b>Nitro</span></div></div></div><div class="dn" aria-hidden="true">↓</div><div class="nd csq"><div class="nd-t">The vehicle ranks up</div><div class="rcs"><span class="rc in"><b>+</b>Rank</span></div></div></div><div class="ln-back">↺ Back to Select race</div></div></div></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">06</span><h2>Where it lives in the game</h2></div><p class="aq-sub">The same resources, on the screens where the player meets them. Notes on the screenshots are mine.</p><div class="aq-caps"><figure><a href="img/asphalt/garage.jpg" target="_blank" rel="noopener"><img src="img/asphalt/garage.jpg" alt="Stats, rank and fuel"></a><figcaption><b>Stats, rank and fuel</b>The garage shows the car’s four stats, its rank against the one the race recommends, and the fuel left.</figcaption></figure><figure><a href="img/asphalt/season-map.jpg" target="_blank" rel="noopener"><img src="img/asphalt/season-map.jpg" alt="Flags and rewards"></a><figcaption><b>Flags and rewards</b>Season flags unlock new races, and each race shows its reward before the player commits.</figcaption></figure><figure><a href="img/asphalt/race-results.jpg" target="_blank" rel="noopener"><img src="img/asphalt/race-results.jpg" alt="What a race pays"></a><figcaption><b>What a race pays</b>Credits, reputation points and blueprint cards, right after the finish line.</figcaption></figure><figure><a href="img/asphalt/upgrades.jpg" target="_blank" rel="noopener"><img src="img/asphalt/upgrades.jpg" alt="Where resources are spent"></a><figcaption><b>Where resources are spent</b>Each upgrade costs resources and adds to the car’s rank.</figcaption></figure></div></section>
<section class="aq-s" id="shop"><div class="aq-h"><span class="aq-n">07</span><h2>The shop</h2></div><p class="aq-sub">Real money buys tokens, and tokens buy credits.</p><figure class="aq-shop"><a href="img/asphalt/shop.jpg" target="_blank" rel="noopener"><img src="img/asphalt/shop.jpg" alt="Asphalt Legends shop: token packs for real money and credit packs for tokens"></a><figcaption>Prices as the game showed them when I made the analysis, in 2026. They may have changed since.</figcaption></figure></section>
<section class="aq-s"><div class="aq-h"><span class="aq-n">08</span><h2>What I took from it</h2></div><p class="aq-sub"></p><div class="aq-concl">CONCLUSION · COMING SOON</div></section>

class Component extends DCLogic {
renderVals() {
// Point at a resource (or tap it on a phone): every place it is spent or earned lights up, the rest fades.
if (!this._aqHl && typeof document !== 'undefined') {
  this._aqHl = true;
  const root = document.documentElement;
  const pick = (t) => t && t.closest ? t.closest('[data-r]') : null;
  document.addEventListener('mouseover', (e) => { const c = pick(e.target); if (c && !root.dataset.lock) root.dataset.hl = c.dataset.r; });
  document.addEventListener('mouseout', (e) => { const c = pick(e.target); if (c && !root.dataset.lock && !c.contains(e.relatedTarget)) delete root.dataset.hl; });
  document.addEventListener('click', (e) => {
    const c = pick(e.target);
    if (!c) { if (root.dataset.lock) { delete root.dataset.lock; delete root.dataset.hl; } return; }
    if (root.dataset.lock === c.dataset.r) { delete root.dataset.lock; delete root.dataset.hl; }
    else { root.dataset.lock = c.dataset.r; root.dataset.hl = c.dataset.r; }
  });
}
return {};
}
}
