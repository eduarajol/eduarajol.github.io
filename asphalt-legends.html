html{scroll-behavior:smooth;background:#15122A}
body{margin:0;background:#15122A}
.aqf{position:relative;color:#fff;font-family:"Exo 2",system-ui,sans-serif;background:#15122A;min-height:100vh;overflow-x:clip}
.aqf::before{content:"";position:fixed;inset:0;background:url(img/asphalt/bg.jpg) center/cover no-repeat;z-index:0;pointer-events:none}
.aqf>*{position:relative;z-index:1}
.aqf *{box-sizing:border-box}
.aqf a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 72px}
.sc{padding:130px 0 40px;scroll-margin-top:0}
/* nav, like the presentation's top bar */
.nv{position:sticky;top:0;z-index:20;height:76px;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 44px;

.nv-l{display:flex;align-items:center;gap:18px;flex-shrink:0}
.nv-ea{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-style:italic;font-weight:800;font-size:12px;letter-spacing:1.5px;opacity:.85;transition:opacity .2s}
.nv-ea:hover{opacity:1}
.nv-ea svg{width:28px;height:28px}
.nv-l i{width:1.5px;height:30px;background:rgba(255,255,255,.25)}
.nv-logo{height:30px;width:auto;display:block}
.nv-t{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.nv-t::-webkit-scrollbar{display:none}
.tab{position:relative;flex-shrink:0;padding:8px 0;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.3px;text-transform:uppercase;text-decoration:none;color:rgba(255,255,255,.82);transition:color .2s}
.tab:hover{color:#fff}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#BEFE00;border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
/* titles: one bold line, one light line, italic and uppercase */
.ttl{margin:0 0 56px;font-style:italic;text-transform:uppercase;line-height:1.08;font-size:44px;letter-spacing:.3px;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.ttl b{display:block;font-weight:800}
.ttl span{display:block;font-weight:400}
.ttl.ctr{text-align:center}
.ttl.row b,.ttl.row span{display:inline}
.hint{margin-top:40px;text-align:center;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.5px;color:#BEFE00}
.hint.left{text-align:left}
.hint.swipe{display:none}
/* cover */
.cv{aspect-ratio:16/9;max-height:100vh;min-height:620px;padding:0;display:flex;align-items:flex-end;background:url(img/asphalt/cover.jpg) center top/cover no-repeat;margin-top:-76px}

.cv{isolation:isolate}
.cv-in{width:100%;max-width:1440px;margin:0 auto;padding:0 72px 72px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.cv-eb{font-style:italic;font-weight:800;font-size:14px;letter-spacing:2px;color:#BEFE00}
.cv h1{margin:0;font-style:italic;font-weight:800;font-size:64px;letter-spacing:.5px;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.6)}
.cv-by{font-style:italic;font-weight:600;font-size:18px;letter-spacing:2px}
.cv-p{margin:10px 0 8px;max-width:720px;font-size:18px;line-height:1.55;font-weight:500;color:rgba(255,255,255,.9);text-wrap:pretty}
.btn-l{display:inline-block;padding:14px 38px 14px 26px;background:#BEFE00;color:#0A0A0A !important;font-style:italic;font-weight:800;font-size:15px;letter-spacing:.5px;text-decoration:none;
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);transition:filter .2s,transform .2s}
.btn-l:hover{filter:brightness(1.08);transform:translateX(3px)}
/* actions */
.acs{display:flex;justify-content:center;gap:34px}
.ac{width:250px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;cursor:default;outline:none;
  background:linear-gradient(180deg,#AF74FF,#914AFB);box-shadow:0 18px 40px rgba(0,0,0,.35);transition:background .25s,transform .25s}
.ac-i{display:block;width:96px;height:96px;background:#fff;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;transition:background .25s,transform .25s}
.ac b{font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase;text-align:center;line-height:1.15;transition:color .25s}
.ac p{margin:0;max-height:0;opacity:0;overflow:hidden;font-size:15px;line-height:1.45;font-weight:600;text-align:center;color:#2A1D45;transition:all .3s ease}
.ac:hover,.ac:focus{background:#F4F1FA;transform:translateY(-6px)}
.ac:hover .ac-i,.ac:focus .ac-i{background:#914AFB;transform:scale(.8)}
.ac:hover b,.ac:focus b{color:#914AFB}
.ac:hover p,.ac:focus p{max-height:120px;opacity:1}
/* resources: dark bars cut on the right, like the presentation */
.gt{margin:56px 0 22px;font-style:italic;font-weight:800;font-size:38px;text-transform:uppercase;letter-spacing:.3px}

.rb{height:72px;display:flex;align-items:center;gap:22px;padding:0 70px 0 26px;background:rgba(31,32,49,.92);color:#fff;font-family:inherit;

.rb .ic{width:30px;height:30px;flex-shrink:0}

.rb.shop:hover{background:#BEFE00;color:#0A0A0A}

.ic.col{display:inline-block;object-fit:contain}

.io-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto;column-gap:36px}

.io-out{grid-row:3;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-top:14px}
.c1 .io-in,.c1 .io-b,.c1 .io-out{grid-column:1}.c2 .io-in,.c2 .io-b,.c2 .io-out{grid-column:2}.c3 .io-in,.c3 .io-b,.c3 .io-out{grid-column:3}

.note{margin:30px 0 0;font-size:14px;font-style:italic;color:rgba(255,255,255,.65)}

.md-in img{display:block;width:100%}

.ft-legal{max-width:1296px;margin:34px auto 0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.55)}

<script>window.DC_PROPS = {};

class Component extends DCLogic {
renderVals() {
// Scroll spy for the tabs, resource highlight, the shop popup and the screenshot zoom.
if (!this._aqF && typeof document !== 'undefined') {
  this._aqF = true;
  const root = document.documentElement;
  const pick = (t) => t && t.closest ? t.closest('[data-r]') : null;
  document.addEventListener('mouseover', (e) => { const c = pick(e.target); if (c && !root.dataset.lock) root.dataset.hl = c.dataset.r; });
  document.addEventListener('mouseout', (e) => { const c = pick(e.target); if (c && !root.dataset.lock && !c.contains(e.relatedTarget)) delete root.dataset.hl; });
  const close = () => { delete root.dataset.md; };
  document.addEventListener('click', (e) => {
    const t = e.target;
    const op = t.closest && t.closest('[data-open]');
    if (op) { root.dataset.md = op.dataset.open; return; }
    const z = t.closest && t.closest('[data-zoom]');
    if (z) {
      const img = document.querySelector('#md-zoom .md-img');
      img.src = z.dataset.zoom; img.alt = z.getAttribute('aria-label') || '';
      document.querySelector('#md-zoom .md-h b').textContent = (z.parentElement.querySelector('figcaption') || {}).textContent || '';
      root.dataset.md = 'zoom'; return;
    }
    if (t.closest && (t.closest('[data-close]') || (t.classList && t.classList.contains('md')))) { close(); return; }
    const c = pick(t);
    if (!c) { if (root.dataset.lock) { delete root.dataset.lock; delete root.dataset.hl; } return; }
    if (root.dataset.lock === c.dataset.r) { delete root.dataset.lock; delete root.dataset.hl; }
    else { root.dataset.lock = c.dataset.r; root.dataset.hl = c.dataset.r; }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  const spy = () => {
    let cur = 'intro';
    document.querySelectorAll('.sc[id]').forEach((s) => { if (s.getBoundingClientRect().top < window.innerHeight * 0.4) cur = s.id; });
    if (root.dataset.sec !== cur) {
      root.dataset.sec = cur;
      const tab = document.querySelector('.tab[data-s="' + cur + '"]');
      if (tab && tab.scrollIntoView && window.matchMedia('(max-width: 760px)').matches) {
        const bar = tab.parentElement; bar.scrollTo({ left: tab.offsetLeft - 20, behavior: 'smooth' });
      }
    }
  };
  window.addEventListener('scroll', spy, { passive: true });
  setTimeout(spy, 300);
}
return {};
}
}
