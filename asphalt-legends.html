<h1 class="m-ph1" style="margin: 0; font-weight: 800; font-size: 88px; line-height: 0.95; letter-spacing: -2.5px">Asphalt Legends</h1>
<p class="m-plead" style="margin: 0; max-width: 720px; font-size: 21px; line-height: 1.5; color: #5A3A40">A resource flow analysis of Asphalt Legends, made during the Game Design Bootcamp. I listed the basic actions and resources of the first sessions, mapped what each action spends and earns, and turned it into the core loop and a wider loop with more gameplay.</p>

<section class="aq-cs" style="flex-shrink: 0; margin: 104px 80px 0; display: flex; flex-direction: column; gap: 24px">
<h2 style="margin: 0; font-weight: 800; font-size: 52px; letter-spacing: -1.5px">What I took from it</h2>
<p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #B92B45">CONCLUSION · WHAT THE ANALYSIS SHOWED</p>
<div class="aq-cg" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px"><div style="background: #EAE4D8; border-radius: 18px; padding: 28px 30px"><div style="display: flex; align-items: baseline; gap: 12px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6B5357">01</span><h3 style="margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.3px; color: #4B1D26">The early game is generous.</h3></div><p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #5A3A40">In my first sessions every race paid enough to keep upgrading. There was always a next step, and I felt well rewarded for playing.</p></div><div style="background: #EAE4D8; border-radius: 18px; padding: 28px 30px"><div style="display: flex; align-items: baseline; gap: 12px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6B5357">02</span><h3 style="margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.3px; color: #4B1D26">Every gate has more than one way through.</h3></div><p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #5A3A40">When a car ran out of fuel, I switched to another one. When a car's rank was too low for a race, I raced with a car that had enough, or upgraded the one I had. I never hit a wall where paying was the only way forward.</p></div><div style="background: #EAE4D8; border-radius: 18px; padding: 28px 30px"><div style="display: flex; align-items: baseline; gap: 12px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6B5357">03</span><h3 style="margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.3px; color: #4B1D26">The garage stretches the session.</h3></div><p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #5A3A40">Each car spends its own fuel, so every new car means more racing before I have to stop. The garage is part of the economy, not just a collection.</p></div><div style="background: #EAE4D8; border-radius: 18px; padding: 28px 30px"><div style="display: flex; align-items: baseline; gap: 12px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6B5357">04</span><h3 style="margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.3px; color: #4B1D26">The loop feeds itself.</h3></div><p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #5A3A40">Races pay credits and part cards, upgrades spend them and raise the rank, and a higher rank opens new races. Tokens sit above it all and can shortcut any gate, but early on the game never pushes them.</p></div></div>
<div class="aq-cg" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 8px"><div style="border: 2px solid #E0D6C4; border-radius: 18px; padding: 28px 30px"><p style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #0F6E62">NEXT STEP</p><p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #5A3A40">If I kept going, I would put numbers on the flow: what each race pays, what each upgrade costs and how many sessions it takes to reach the next rank. That would show when the early generosity slows down and the gates start to bite.</p></div><div style="background: #4B1D26; border: 2px solid #4B1D26; border-radius: 18px; padding: 28px 30px"><p style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #E8C27A">WHAT I LEARNED</p><p style="margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: #F5F0E8">Splitting a game into actions and resources, and what each one spends and earns, makes its economy readable. I only understood why the game felt so fair once I had mapped it.</p></div></div>
</section>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'actions', zoom: null };
if (typeof window !== 'undefined') {
window.addEventListener('keydown', (ev) => {

  document.addEventListener('mousemove', (e) => {

    if (!im) { hide(); return; }
    const r = im.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;

    const wrap = (t) => t && t.closest ? t.closest('.pc-wrap') : null;

  document.addEventListener('click', (e) => {
    if (!(e.target.closest && e.target.closest('.ab-btn'))) return;
    setTimeout(() => { const s = document.querySelector('.ab-scroll'); if (s) s.scrollTop = 0; }, 0);
  });
}

const GD = { tone: '#B92B45', ink: '#F4A6B4', fill: '#4B1D26' };
const UX = { tone: '#0F6E62', ink: '#9ED8CC', fill: '#0A4F46' };
const list = [
{ id: 'actions', cat: 'RESEARCH', title: 'Initial actions', ...UX },
{ id: 'resources', cat: 'ECONOMY', title: 'Basic resources', ...GD },
{ id: 'io', cat: 'ECONOMY', title: 'Inputs & outputs', ...GD },
{ id: 'core', cat: 'ECONOMY', title: 'Core game loop', ...GD },
{ id: 'loop', cat: 'ECONOMY', title: 'More gameplay', ...GD },
{ id: 'game', cat: 'RESEARCH', title: 'In the game', ...UX }
];
const picked = this.state.picked;
const stop = (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); };
const zoomItem = ZOOM.find((x) => x.id === this.state.zoom) || null;
const g = this.group();
const fixed = typeof window !== 'undefined' && window.innerWidth <= 760;
const zoomHandlers = {};
ZOOM.forEach((x) => { zoomHandlers['zoom_' + x.id] = () => this.setState({ zoom: x.id }); zoomHandlers['zd_' + x.id] = (zoomItem && zoomItem.id === x.id) ? 'block' : 'none'; });
const abilities = list.map((a) => {
const on = a.id === picked;
return {
...a,
bg: on ? (a.fill || '#4B1D26') : '#EAE4D8',
fg: on ? '#F5F0E8' : '#4B1D26',
border: on ? '4px solid ' + a.tone : '2px solid #D3C9B6',
catColor: on ? a.ink : a.tone,
shift: on ? 'translateX(8px)' : 'none', tone: a.tone || '#4B1D26',
pick: () => this.setState({ picked: a.id, zoom: null })
};
});
const selected = list.find((a) => a.id === picked) || list[0];
return {
...zoomHandlers,
zoomOn: !!zoomItem,
zImg: zoomItem ? zoomItem.id : '',
zCap: zoomItem ? zoomItem.cap : '',
zCount: zoomItem ? (g.indexOf(zoomItem.id) + 1) + ' / ' + g.length : '',
zMany: g.length > 1,
zPos: fixed ? 'fixed' : 'absolute',
zRadius: fixed ? '0' : '28px',
zAlign: 'center',
zArrowTop: '50%',
zMaxH: fixed ? 'calc(100vh - 190px)' : 'calc(100% - 60px)',
closeZoom: (ev) => { stop(ev); this.setState({ zoom: null }); },
prevZoom: (ev) => { stop(ev); this.step(-1); },
nextZoom: (ev) => { stop(ev); this.step(1); },
tone: selected.tone,
abilities,
isActions: picked === 'actions',
isResources: picked === 'resources',
isIo: picked === 'io',
isCore: picked === 'core',
isLoop: picked === 'loop',
isGame: picked === 'game'
};
}
}

</script>
</body>
</html>
