.slot{position:absolute;width:250px;height:358px}
.card{position:absolute;inset:0;border-radius:18px;box-shadow:0 14px 30px rgba(75,29,38,.16);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.face{border-radius:18px}
.btn{font:inherit;font-weight:700;font-size:15px;padding:12px 20px;border-radius:10px;border:2px solid #4B1D26;background:transparent;color:#4B1D26;cursor:pointer;transition:background .18s ease,color .18s ease}
.btn:hover{background:#4B1D26;color:#F5F0E8}
.side{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;box-shadow:0 14px 30px rgba(75,29,38,.18)}
.pack{position:absolute;left:360px;top:50px;width:280px;height:400px;cursor:pointer;z-index:6;animation:pkIdle 2.4s ease-in-out infinite}
.pk-top,.pk-body{position:absolute;left:0;right:0;background:linear-gradient(160deg,#5E2733 0%,#4B1D26 45%,#3A141C 100%);box-shadow:0 18px 36px rgba(75,29,38,.25)}
.pk-top{top:0;height:62px;border-radius:14px 14px 0 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-sizing:border-box;border-bottom:2px dashed rgba(235,211,168,.55);font-size:9px;font-weight:800;letter-spacing:3px;color:rgba(235,211,168,.6)}
.pk-body{top:62px;bottom:0;border-radius:0 0 14px 14px;display:flex;align-items:center;justify-content:center}
.crimp{position:absolute;left:0;right:0;top:0;height:12px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,rgba(235,211,168,.28) 0 3px,transparent 3px 7px)}
.crimp.bottom{top:auto;bottom:0;border-radius:0 0 14px 14px}
.foil{position:absolute;inset:0;border-radius:14px;pointer-events:none;overflow:hidden}
.foil::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,240,210,.22),transparent);animation:pkShine 2.8s ease-in-out infinite}
@keyframes pkIdle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes pkShine{0%{left:-60%}60%,100%{left:130%}}
.pk.open .pack{animation:none;pointer-events:none}
.pk.open .pk-top{animation:pkTear .55s cubic-bezier(.3,.6,.4,1) both}
.pk.open .pk-body,.pk.open .foil{animation:pkDrop .6s ease-in .2s both}
@keyframes pkTear{0%{transform:none;opacity:1}100%{transform:translate(70px,-150px) rotate(24deg);opacity:0}}
@keyframes pkDrop{0%{transform:none;opacity:1}100%{transform:translateY(160px) scale(.92);opacity:0}}
.pko{opacity:0;pointer-events:none;transform:translate(var(--dx),var(--dy)) scale(.55)}
.pk.open .pko{pointer-events:auto}
.pk.open.a .pko{animation:pkOutA .8s cubic-bezier(.2,.8,.2,1) var(--d) both}.pk.open.b .pko{animation:pkOutB .8s cubic-bezier(.2,.8,.2,1) var(--d) both}
@keyframes pkOutA{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.55)}25%{opacity:1}100%{opacity:1;transform:rotate(var(--r))}}
@keyframes pkOutB{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.55)}25%{opacity:1}100%{opacity:1;transform:rotate(var(--r))}}
.pko:hover{z-index:10 !important}
.pko .card{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease}
.pko:hover .card{transform:translateY(-18px) scale(1.04);box-shadow:0 26px 46px rgba(75,29,38,.28)}
.sheen{position:absolute;inset:0;border-radius:18px;overflow:hidden;pointer-events:none}
.leg .sheen::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-70%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(235,211,168,.7),transparent)}

randt, and although our time working together was brief, from day one he made me feel welcome and part of the team. Always attentive to the wellbeing of others, trying to make us smile. I would highlight his commitment, high standards and perfectionism, qualities that will no doubt take him far in any challenge he takes on.", "name": "Sandra Campaña González", "role": "Senior UX/UI & Product Designer", "relation": "SAME TEAM", "note": "Translated from Spanish"}];
