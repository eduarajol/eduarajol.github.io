<script>window.DC_PROPS = {"accent": "#EBD3A8"};

const FAQS = [{"q": "Why move from automotive to games?", "a": "Cars were never my passion, but solving the problems that made the experience worse for drivers was. At SEAT and CUPRA, my best moments were when my proposals made the infotainment better. After several years I wanted to do that same work on a subject I truly love, so I trained in game design at Level UP Game Dev Hub and moved into games."}, {"q": "What can you share about work under NDA?", "a": "I can talk about my role and what I owned, the type of game, the process and tools I used, the design decisions I made and why, and how I worked with the team. What stays private: the client's name, the game itself, any project material and its specific mechanics."}, {"q": "Game Designer or UX Designer?", "a": "Both. I worked as a UX Designer for years, trained as a Game Designer, and in my freelance work I already do both roles. I'm open to either, and I do my best work where they meet: onboarding, flows, feedback and the documentation that ties them together."}, {"q": "Remote, hybrid or on-site?", "a": "I'm based in Barcelona. I've worked hybrid at SEAT and CUPRA and fully remote as a freelancer, and both work well for me. Barcelona and its surroundings are my first choice."}, {"q": "Full-time or freelance?", "a": "Right now I'm prioritising a full-time role at a studio. I'm also open to freelance projects."}, {"q": "What are you playing right now?", "a": "007 First Light on PS5, for a story that hooks me and action-RPG gameplay. Puzzled on Netflix, for its daily brain teasers. Marvel Snap, which mixes a lifelong passion (I collect Marvel comics) with quick matches and collecting. And Whiteout Survival, which I'm playing with an analyst's eye to study its economy and progression."}];
const ALLIES = [{"quote": "Detail-oriented, proactive, and a true role model. These are the three words I would use to describe Eduard. During my time working for SEAT, I had the pleasure of working with him, and I can confidently say he is both an outstanding designer and a remarkable leader. Eduard always has a clear vision of the strategy, taking into account not only all the teams involved but also the current and future workload. He knows how to lead with clarity and kindness and knows exactly how to support and guide the team while staying involved in the day to day.", "name": "Laura Nepormoseno", "role": "UX Designer & Concept", "relation": "REPORTED TO EDUARD", "note": ""}, {"quote": "I worked with Edu at Bertrandt and learned so much from him. He has that rare combination of clarity to make decisions, empathy to listen to others and patience to see processes through, even in the most challenging moments. He is proactive and detail-oriented, always looking for ways to improve the team's work and his own, and truly involved in everyone's wellbeing. In short, Edu is an excellent professional and leader, but above all, a great person. I recommend him with complete confidence.", "name": "Júlia Farran Huguet", "role": "UX/UI Designer", "relation": "SAME TEAM", "note": "Translated from Spanish"}, {"quote": "I have the pleasure of working with Eduard on my current project, and I can say he is the definition of a leader. His way of working made me feel completely reflected in him, as we share many interests and approaches. He is always available to help us improve and manage our time and tasks, always in a close and collaborative way. His knowledge of UX and automotive is impressive! I recommend Eduard without hesitation. He is an exceptional leader, very professional, and an incredible person.", "name": "Blanca Recasens Meca", "role": "HMI Innovation Project Lead", "relation": "SAME TEAM", "note": "Translated from Spanish"}, {"quote": "I overlapped with Edu at Bertrandt, and although our time working together was brief, from day one he made me feel welcome and part of the team. Always attentive to the wellbeing of others, trying to make us smile. I would highlight his commitment, high standards and perfectionism, qualities that will no doubt take him far in any challenge he takes on.", "name": "Sandra Campaña González", "role": "Senior UX/UI & Product Designer", "relation": "SAME TEAM", "note": "Translated from Spanish"}];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { ally: 0, faq: 0, tick: 0 };
this.lastRel = null;
if (typeof window !== 'undefined') window.addEventListener('resize', () => this.setState({}));
}
renderVals() { return Object.assign({}, this.baseVals(), this.packVals()); }
packVals() {
const A = (function () {
const k = this.state.k || 0;
const st = this.state;
const isOpen = !!st.open;
const a = st.a == null ? 0 : st.a, b = st.b == null ? 0 : st.b;
const p = Math.max(0, b - a);
// Map the pointer to the pack: the zone is 360 wide with the 280px pack 40px in from its left edge
const norm = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const sx = r.width / 360, sy = r.height / 100;
  const x = (e.clientX - r.left - 40 * sx) / (280 * sx);
  const y = (e.clientY - r.top) / sy;
  return { x: Math.max(0, Math.min(1, x)), inBand: y > -40 && y < 140 };
};
return {
  st: (isOpen ? 'open ' : '') + (k % 2 ? 'b' : 'a'),
  dragCls: (st.drag ? 'drag ' : '') + (st.touched ? 'touched' : ''),
  cutL: (a * 280).toFixed(0) + 'px',
  cutW: (p * 280).toFixed(0) + 'px',
  flap: 'rotate(' + (-p * 5).toFixed(2) + 'deg) translateY(' + (-p * 6).toFixed(1) + 'px)',
  down: (e) => {
    if (isOpen) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    const n = norm(e);
    this.setState({ drag: true, touched: true, a: n.x, b: n.x });
  },
  move: (e) => {
    if (!this.state.drag || this.state.open) return;
    const n = norm(e);
    if (!n.inBand) return;
    const na = Math.min(this.state.a, n.x), nb = Math.max(this.state.b, n.x);
    if (nb - na >= 0.88) this.setState({ drag: false, open: true, a: 0, b: 1 });
    else this.setState({ a: na, b: nb });
  },
  up: () => {
    if (!this.state.drag) return;
    this.setState({ drag: false, a: 0, b: 0 });
  },
  again: () => this.setState({ open: false, drag: false, a: 0, b: 0, k: k + 1 }),
};
}).call(this);
const B = (function () {
const t = this.state.t || {};
const v = {};
for (let i = 0; i < 4; i++) {
  v['t' + i] = t[i] || 'transform: none';
  v['in' + i] = () => {
    const rnd = (a, b) => a + Math.random() * (b - a);
    const sx = Math.random() < 0.5 ? -1 : 1, sy = Math.random() < 0.5 ? -1 : 1;
    const rx = (sy * rnd(5, 11)).toFixed(1), ry = (sx * rnd(6, 13)).toFixed(1), rz = (rnd(-4, 4)).toFixed(1);
    const lift = rnd(14, 26).toFixed(0), sh = (-sx * rnd(8, 16)).toFixed(0);
    this.setState({ t: Object.assign({}, this.state.t, { [i]: 'transform: translateY(-' + lift + 'px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) rotateZ(' + rz + 'deg) scale(1.05); box-shadow: ' + sh + 'px 30px 46px rgba(75,29,38,.26)' }) });
  };
  v['out' + i] = () => this.setState({ t: Object.assign({}, this.state.t, { [i]: 'transform: none' }) });
}
return v;
}).call(this);

// Auto-open: after 10 s, or once the top half of the pack has scrolled out of view.
const autoOpen = () => { if (!this.state.open) this.setState({ open: true, drag: false, a: 0, b: 1 }); };
if (!this._pkScroll && typeof window !== 'undefined') {
  this._pkScroll = true;
  const check = () => {
    if (this.state.open) return;
    const el = document.querySelector('.pack');
    if (!el) return;
    const r = el.getBoundingClientRect();
    const hd = document.querySelector('header');
    const top = hd && getComputedStyle(hd).position === 'sticky' ? Math.max(0, hd.getBoundingClientRect().bottom) : 0;
    if (r.top + r.height / 2 < top) autoOpen();
  };
  window.addEventListener('scroll', check, { passive: true });
  setTimeout(check, 400);  // the page may load already scrolled (a #deck link, a reload)
}
const kk = this.state.k || 0;
const T = { autoOpen, pkTimer: this.state.open ? 'none' : (kk % 2 ? 'pkAutoB' : 'pkAutoA') + ' 10s linear forwards', pkPlay: this.state.drag ? 'paused' : 'running' };
return Object.assign({}, A, B, T);
}
baseVals() {
// Ally cards loop: every recommendation exists twice, so a card is always waiting on the right.
// `ally` only ever counts up or down; each card's place is its distance from it.
const n = ALLIES.length, N = n * 2;
const pos = this.state.ally;
const cur = ((pos % n) + n) % n;
const go = (p) => this.setState({ ally: p, tick: this.state.tick + 1 });
const nearest = (d) => { d = ((d % n) + n) % n; return d > n / 2 ? d - n : d; };
const vw = typeof window !== 'undefined' ? document.documentElement.clientWidth : 1440;
const mobile = vw <= 760;
const CARD = mobile ? vw - 56 : 600, GAP = mobile ? 12 : 32, START = mobile ? 20 : 80;
const STEP = CARD + GAP;
const rels = [];
const cards = [];
for (let j = 0; j < N; j++) {
const m = (((j - pos) % N) + N) % N;
const rel = m >= n ? m - N : m;
const before = this.lastRel ? this.lastRel[j] : rel;
const wraps = Math.abs(rel - before) >= n;
rels.push(rel);
cards.push({
...ALLIES[j % n],
n: String((j % n) + 1).padStart(2, '0'),
op: rel === 0 ? 1 : 0.35,
border: rel === 0 ? '#C9A86E' : '#FFFFFF',
cursor: rel === 0 ? 'default' : 'pointer',
hidden: j >= n ? 'true' : 'false',
dx: ((rel - j) * STEP) + 'px',
tr: wraps ? 'none' : 'transform 0.45s ease, opacity 0.45s ease, border-color 0.45s ease',
pick: () => go(pos + rel)
});
}
this.lastRel = rels;
const fill = 'allyFill' + (this.state.tick % 2 ? 'A' : 'B') + ' 10s linear forwards';
return {
accent: this.props.accent ?? '#7A5F33',
allies: cards,
allyDots: ALLIES.map((a, i) => ({
w: i === cur ? '44px' : '10px',
anim: i === cur ? fill : 'none',
pick: () => go(pos + nearest(i - cur)),
done: () => go(pos + 1)
})),
allyX: START + 'px',
allyCount: String(cur + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'),
allyPrev: () => go(pos - 1),
allyNext: () => go(pos + 1),
faqs: FAQS.map((f, i) => {
const open = this.state.faq === i;
return { ...f, disp: open ? 'block' : 'none', sign: open ? '−' : '+', expanded: open ? 'true' : 'false', border: open ? '#C9A86E' : '#EAE4D8', signBg: open ? '#EBD3A8' : '#E0D8C8', signFg: open ? '#4B1D26' : '#4B1D26', toggle: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ faq: open ? -1 : i }); }, cls: open ? 'is-open' : '', card: () => { if (open) this.setState({ faq: -1 }); } };
})
};
}
}
