<h1 class="m-ph1" style="margin: 0; font-weight: 800; font-size: 88px; line-height: 0.95; letter-spacing: -2.5px">Ocean's One</h1>
<p class="m-plead" style="margin: 0; max-width: 720px; font-size: 21px; line-height: 1.5; color: #5A3A40">A social stealth heist game set in the world of the Ocean's films, pitched as my Game Design Bootcamp final project. I designed it end to end, from pillars and player profiles to the 3C, the level structure and the game loops, and presented it to tutors from the industry.</p>
<div class="m-facts" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 8px">
<div style="padding: 16px 18px; background: #EAE4D8; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #6B5357">ROLE</div><div style="font-weight: 700; font-size: 16px">Game Designer</div></div>
<div style="padding: 16px 18px; background: #EAE4D8; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #6B5357">PERIOD</div><div style="font-weight: 700; font-size: 16px">2026 · Bootcamp</div></div>
<div style="padding: 16px 18px; background: #EAE4D8; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #6B5357">TYPE</div><div style="font-weight: 700; font-size: 16px">Social stealth · consoles &amp; PC</div></div>
<div style="padding: 16px 18px; background: #EAE4D8; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #6B5357">SETUP</div><div style="font-weight: 700; font-size: 16px">Solo, with mentoring</div></div>
</div>
</div>
</section>

<h3 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.03; letter-spacing: -1.2px">A heist without a single shot</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5A3A40">My Game Design Bootcamp final project: a new game, pitched in 15 minutes to classmates, the school and tutors from the industry. Ocean&#x27;s One is a social stealth game set in the world of the Ocean&#x27;s films, where you plan and pull off heists without hurting anyone. I designed the concept on my own, with a few mentoring sessions along the way.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #6B5357">THE CONCEPT IN FOUR LINES</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">1</div><div style="font-weight: 700; font-size: 16px">The hook</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">Hitman meets Ocean&#x27;s Eleven: social stealth, planning, no violence.</div></div>
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">2</div><div style="font-weight: 700; font-size: 16px">Three rules</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">Hurt no one, rob only those who deserve it, play like you&#x27;ve nothing to lose.</div></div>
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">3</div><div style="font-weight: 700; font-size: 16px">Episodic heists</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">Each episode is one high-value target: a mansion, a casino, a gala.</div></div>
<div style="padding: 18px; background: #F5F0E8; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">4</div><div style="font-weight: 700; font-size: 16px">For consoles &amp; PC</div><div style="font-size: 14px; line-height: 1.45; color: #5A3A40">PS5, Xbox, PC and Nintendo Switch 2.</div></div>
</div>

<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #5A3A40">Every heist follows the same four phases, the backbone of the episodic format. The level itself is split into social, unauthorised and dangerous zones, so the player always knows how risky a step is. My example level: a masked ball at the Palazzo Ducale in Venice, where the target is a historic mask.</p>
