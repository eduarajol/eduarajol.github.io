<p class="m-plead" style="margin: 0; max-width: 720px; font-size: 21px; line-height: 1.5; color: #CFCCE0">Game and UX design for a game studio client: from designing new features from scratch to rethinking existing ones, and documenting it all so the team could build it.</p>

<div style="padding: 16px 18px; background: #1A1F4D; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #9AA3C7">ROLE</div><div style="font-weight: 700; font-size: 16px">Game &amp; UX Designer</div></div>
<div style="padding: 16px 18px; background: #1A1F4D; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #9AA3C7">PERIOD</div><div style="font-weight: 700; font-size: 16px">2026 — now</div></div>
<div style="padding: 16px 18px; background: #1A1F4D; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #9AA3C7">TYPE</div><div style="font-weight: 700; font-size: 16px">Free-to-play casual mobile</div></div>
<div style="padding: 16px 18px; background: #1A1F4D; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #9AA3C7">SETUP</div><div style="font-weight: 700; font-size: 16px">Freelance</div></div>
</div>
</div>

<div style="font-weight: 700; font-size: 14px; letter-spacing: 2px; color: {{tone}}">GAME DESIGN · FEATURE DESIGN &amp; ONE-PAGERS</div>
<h3 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.03; letter-spacing: -1.2px">Features built on the pillars</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #CFCCE0">I designed new features from scratch, each documented in its own one-pager: the player experience, design goals, mechanics and the dynamics they create. I scored every proposal against the game's pillars and flagged its risks, so the team could decide with the full picture.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #9AA3C7">HOW I BUILT EACH FEATURE</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">1</div><div style="font-weight: 700; font-size: 16px">Start from the pillars</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">What must this feature reinforce?</div></div>
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">2</div><div style="font-weight: 700; font-size: 16px">Write the player moment</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">A short first-person story of how it feels.</div></div>
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">3</div><div style="font-weight: 700; font-size: 16px">Set design goals</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">Testable: you can say if you met them.</div></div>
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">4</div><div style="font-weight: 700; font-size: 16px">Mechanics → dynamics</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">The rules, and the behaviour they create.</div></div>
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">5</div><div style="font-weight: 700; font-size: 16px">Score against pillars</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">Strengths and risks, side by side.</div></div>
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">6</div><div style="font-weight: 700; font-size: 16px">Flag what to prototype</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">So the team tests the riskiest part first.</div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #9AA3C7">PRINCIPLES I APPLIED ACROSS EVERY FEATURE</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">

<div style="font-weight: 800; font-size: 21px">Reads instantly</div>
<div style="font-size: 15px; line-height: 1.5; color: #3A3F6B">Each core interaction is understood at first sight, with no tutorial and a direct cause and effect.</div>

<div style="font-size: 15px; line-height: 1.5; color: #3A3F6B">Players can see where they stand and how close they are, at a glance.</div>

<h3 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1.03; letter-spacing: -1.2px">References, not guesses</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #CFCCE0">Early in the project, I played games of the same genre on device, recorded my sessions and redrew their flows in Figma. The findings, shared as a presentation, shaped the FTUE I designed and became the references section of every feature one-pager.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #9AA3C7">HOW I RAN IT</div>

<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">3</div><div style="font-weight: 700; font-size: 16px">Redraw the flows</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">Screen by screen in Figma, explaining each step.</div></div>
<div style="padding: 18px; background: #12163A; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><div style="font-weight: 800; font-size: 26px; color: {{tone}}">4</div><div style="font-weight: 700; font-size: 16px">Tag do &amp; don't</div><div style="font-size: 14px; line-height: 1.45; color: #CFCCE0">What fits the game, and what doesn't.</div></div>

<div style="font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #9AA3C7">WHAT IT PRODUCED</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">

<div style="font-weight: 800; font-size: 21px">Do &amp; don't</div>
<div style="font-size: 15px; line-height: 1.5; color: #3A3F6B">Proven patterns worth adapting to the game's pillars, and friction to avoid, spotted by playing as a newcomer.</div>
</div>
<div style="padding: 22px; background: #F3F1EA; color: #12163A; border-radius: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 96px; border-radius: 12px; background: #E4E0D4; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: 14px">
<span style="padding: 7px 11px; background: #FFFFFF; border-radius: 8px">A</span>
<span>vs</span>

</div>

<script>window.DC_PROPS = {"accent": "#E9B949"};

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'feature' };
}
renderVals() {
const accent = this.props.accent ?? '#E9B949';
const GD = { tone: '#F08BA6', ink: '#9C3556' };
const UX = { tone: '#6FD3C2', ink: '#1F6E62' };
const PR = { tone: '#9AA3C7', ink: '#3A3F6B' };
const list = [
{ id: 'feature', num: '01', cat: 'GAME DESIGN', title: 'Feature design & one-pagers', ...GD },
{ id: 'benchmark', num: '02', cat: 'RESEARCH', title: 'Benchmark', ...UX },
{ id: 'ftue', num: '03', cat: 'UX', title: 'FTUE definition', ...UX },
{ id: 'flows', num: '04', cat: 'UX', title: 'Screen flows', ...UX },
{ id: 'rework', num: '05', cat: 'UX', title: 'UX rework of existing features', ...UX },
{ id: 'gdd', num: '06', cat: 'DOCUMENTATION', title: 'GDD', ...GD },
{ id: 'modes', num: '07', cat: 'GAME DESIGN', title: 'New game modes', ...GD }
];
const picked = this.state.picked;
const abilities = list.map((a) => {
const on = a.id === picked;
return {
...a,
bg: on ? '#F3F1EA' : '#1A1F4D',
fg: on ? '#12163A' : '#F3F1EA',
border: on ? '4px solid ' + a.tone : '2px solid #3A3F75',
catColor: on ? a.ink : a.tone,
shift: on ? 'translateX(8px)' : 'none',
pick: () => this.setState({ picked: a.id })
};
});
const selected = list.find((a) => a.id === picked) || list[0];
const tone = selected.tone;
return {
accent,
tone,
abilities,
selected,
isFeature: picked === 'feature',
isBenchmark: picked === 'benchmark',
isFtue: picked === 'ftue',
isFlows: picked === 'flows',
isRework: picked === 'rework',
isGdd: picked === 'gdd',
isModes: picked === 'modes',
isPending: !['feature', 'benchmark', 'ftue', 'flows', 'rework', 'gdd', 'modes'].includes(picked)
};
}
}

</script>
